[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weatherstats"
version = "0.1.0"
description = "Load a Kaggle weather dataset with pandas and compute descriptive statistics on it."
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Tyler Francom"}]
dependencies = [
    "pandas>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
