
[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "weatherstats-kingdomtily"
version = "0.0.1"
description = "Load weather CSV data with pandas and calculate descriptive statistics."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "TYLER FRANCOM" },
]
license = "MIT"
dependencies = [
  "pandas>=2.0",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
[project.urls]
Homepage = "https://github.com/Kingdomtily/Python-Software-Dev"
