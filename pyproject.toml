
[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "weatherstats-kingdomtily"
version = "0.3.0"
description = "Load weather CSV data with pandas and calculate descriptive statistics."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "matplotlib>=3.7",
  "pyspark",
  "flask",
  "flask-sqlalchemy",
]
authors = [
  { name = "TYLER FRANCOM" },
]
license = "MIT"

classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
[project.urls]
Homepage = "https://github.com/Kingdomtily/Python-Software-Dev"

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["."]
addopts = "--doctest-modules"